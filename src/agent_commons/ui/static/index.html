<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Commons — read-only</title>
<style nonce="__CSP_NONCE__">
:root{
  --bg:#fbfbfd; --surface:#fff; --surface-2:#f4f4f7; --border:#dcdce3;
  --fg:#1c1c22; --muted:#6a6a76; --edge:#9a9aa8;
  --ok:#1d7a44; --warn:#8a5a00; --bad:#a02020; --info:#2b5fd9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17171b; --surface:#212127; --surface-2:#26262d; --border:#3a3a44;
    --fg:#f0f0f4; --muted:#a0a0ae; --edge:#5c5c68;
    --ok:#4ec27f; --warn:#d9a441; --bad:#e06c6c; --info:#7aa2f7;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
}
header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border);
}
header h1{font-size:14px; margin:0; font-weight:600}
.pill{
  padding:2px 8px; border:1px solid var(--border); border-radius:999px;
  font-size:11px; color:var(--muted); background:var(--surface-2);
}
.pill.live{color:var(--ok); border-color:var(--ok)}
.pill.reconnecting{color:var(--warn); border-color:var(--warn)}
.pill.gap{color:var(--bad); border-color:var(--bad)}
.trust{font-size:11px; color:var(--muted)}
main{display:flex; height:calc(100% - 84px)}
#canvas{flex:1; background:var(--bg); cursor:grab; touch-action:none}
#canvas:active{cursor:grabbing}
aside{
  width:380px; border-left:1px solid var(--border); background:var(--surface);
  overflow:auto; padding:12px; display:none;
}
aside.open{display:block}
aside h2{font-size:13px; margin:0 0 8px}
aside pre{
  font:12px/1.5 ui-monospace,"JetBrains Mono",monospace; white-space:pre-wrap;
  word-break:break-word; background:var(--surface-2); padding:8px;
  border:1px solid var(--border); border-radius:6px; margin:0;
}
footer{
  padding:6px 12px; border-top:1px solid var(--border); background:var(--surface);
  font-size:11px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap;
}
.node rect{fill:var(--surface); stroke:var(--border); stroke-width:1.5}
.node.stale rect{stroke-dasharray:5 3}
/* A node nobody but the human can unblock.  On the graph itself, because the
   whole point is not having to open a list to find out what is stuck. */
.node.awaits rect{stroke:var(--warn); stroke-width:3}
.node.awaits text.meta{fill:var(--warn)}
.node.role rect{fill:var(--surface-2)}
.node text{fill:var(--fg); font-size:11px}
.node text.meta{fill:var(--muted); font-size:10px}
.node.sel rect{stroke:var(--info); stroke-width:2.5}
.node.neighbour rect{stroke:var(--info); stroke-width:2}
/* Focus mode keeps unrelated work visible but clearly secondary, so the graph
   stays readable when a node has many edges. */
.node.faded{opacity:.14}
.edge{fill:none; stroke:var(--edge); stroke-width:1.4}
.edge.comm{stroke-dasharray:4 3}
.edge.faded{opacity:.07}
.edge.incident{stroke:var(--info); stroke-width:2.2; opacity:1}
button{
  font:12px/1 ui-sans-serif,system-ui,sans-serif; color:var(--fg);
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:6px; padding:5px 9px; cursor:pointer;
}
button:hover{border-color:var(--info)}
button:focus-visible{outline:2px solid var(--info); outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--info); color:var(--info)}
.actions{display:flex; gap:8px; align-items:center; margin:0 0 10px; flex-wrap:wrap}
.pill.focus{color:var(--info); border-color:var(--info)}
.pill.blocked{color:var(--warn); border-color:var(--warn)}
.tabs{display:flex; gap:6px; margin:0 0 10px}
.tabs button[aria-selected="true"]{border-color:var(--info); color:var(--info)}
.panel{display:none}
.panel.open{display:block}
.field{display:block; margin:0 0 8px}
.field span{display:block; font-size:11px; color:var(--muted); margin:0 0 3px}
.field input,.field select,.field textarea{
  width:100%; font:12px/1.4 ui-sans-serif,system-ui,sans-serif; color:var(--fg);
  background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:6px;
}
.field textarea{min-height:96px; resize:vertical}
.note{font-size:11px; color:var(--muted); margin:8px 0}
.note.warn{color:var(--warn)}
.result{font-size:11px; margin:8px 0 0; word-break:break-word}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.grants{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.band-label{fill:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em}
.ok{fill:var(--ok)} .bad{fill:var(--bad)} .warn{fill:var(--warn)} .info{fill:var(--info)}
.muted{fill:var(--muted)}
.empty{fill:var(--muted); font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Agent Commons</h1>
  <span class="pill" id="workspace">—</span>
  <span class="pill" id="stream">connecting</span>
  <span class="pill" id="writes">writes disabled</span>
  <span class="trust" id="layers"></span>
</header>
<main>
  <svg id="canvas" role="img" aria-label="workspace graph"></svg>
  <aside id="inspector">
    <h2 id="inspector-title">—</h2>
    <div class="actions">
      <button type="button" id="focus-toggle" aria-pressed="false">Isolate connections</button>
      <span class="pill" id="focus-count"></span>
      <span class="pill blocked" id="blocked-pill" hidden>waiting on you</span>
    </div>
    <div class="tabs" id="tabs">
      <button type="button" data-panel="record" aria-selected="true">Record</button>
      <button type="button" data-panel="proposals" aria-selected="false" hidden>Proposals</button>
      <button type="button" data-panel="message" aria-selected="false" hidden>Message</button>
      <button type="button" data-panel="settings" aria-selected="false" hidden>⚙ Settings</button>
    </div>

    <section class="panel open" id="panel-record">
      <pre id="inspector-body"></pre>
    </section>

    <section class="panel" id="panel-proposals">
      <p class="note">A role asked for something it may not record itself.
        Confirming creates exactly what was proposed, credited to its proposer.</p>
      <div id="proposal-list"></div>
      <p class="result" id="proposal-result"></p>
    </section>

    <section class="panel" id="panel-message">
      <p class="note" id="message-note"></p>
      <label class="field"><span>Subject (new thread only)</span>
        <input type="text" id="message-subject" autocomplete="off"></label>
      <label class="field"><span>Message to this role</span>
        <textarea id="message-body"></textarea></label>
      <button type="button" id="message-send">Send</button>
      <p class="result" id="message-result"></p>
    </section>

    <section class="panel" id="panel-settings">
      <p class="note" id="settings-note"></p>
      <div class="grants">
        <label class="field"><span>Create roles</span>
          <select id="grant-create_roles"></select></label>
        <label class="field"><span>Retire roles</span>
          <select id="grant-retire_roles"></select></label>
        <label class="field"><span>Open links</span>
          <select id="grant-open_links"></select></label>
        <label class="field"><span>Context</span>
          <select id="setting-context_mode"></select></label>
      </div>
      <label class="field"><span>Display name</span>
        <input type="text" id="setting-name" autocomplete="off"></label>
      <label class="field"><span>Required skills (operator catalogue)</span>
        <select id="setting-skills" multiple size="4"></select></label>
      <label class="field"><span>MCP servers (narrows the profile, never widens)</span>
        <select id="setting-mcp" multiple size="4"></select></label>
      <label class="field"><span>Tools (narrows the profile, never widens)</span>
        <select id="setting-tools" multiple size="4"></select></label>
      <label class="field"><span>Reason for this change</span>
        <input type="text" id="setting-reason" autocomplete="off"></label>
      <label class="field" id="downgrade-field" hidden>
        <span>Weakening isolation — recorded reason (needs agent:isolation_downgrade)</span>
        <input type="text" id="setting-downgrade" autocomplete="off"></label>
      <div class="actions">
        <button type="button" id="settings-save">Save</button>
        <button type="button" id="settings-retire">Retire…</button>
        <button type="button" id="settings-retire-cascade">Retire with everything it created…</button>
      </div>
      <p class="result" id="settings-result"></p>
      <p class="note" id="settings-model"></p>
    </section>
  </aside>
</main>
<footer>
  <span id="counts"></span>
  <span id="issues"></span>
  <span id="truncation"></span>
</footer>
<script nonce="__CSP_NONCE__">
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const COLUMN = 210, ROW = 118, W = 180, H = 62;

// --- auth -----------------------------------------------------------------
const hashToken = new URLSearchParams(location.hash.slice(1)).get("t");
if (hashToken) { sessionStorage.setItem("ac_ui_token", hashToken); }
const TOKEN = hashToken || sessionStorage.getItem("ac_ui_token") || "";
history.replaceState(null, "", location.pathname);

function authHeaders(extra) {
  const headers = Object.assign({ "Authorization": "Bearer " + TOKEN }, extra || {});
  return headers;
}
async function post(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: authHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify(body),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    // Refusals name the guard they tripped; that string is the useful part.
    throw new Error((payload.error && payload.error.message) || ("request " + response.status));
  }
  return payload;
}

async function api(path) {
  const response = await fetch(path, { headers: authHeaders() });
  if (!response.ok) { throw new Error("request failed: " + response.status); }
  return response.json();
}

// --- status glyphs --------------------------------------------------------
// A green tick means "a human accepted this", never "a process exited zero".
// Conflating the two turns the graph into a false-consensus channel, which is
// the exact failure the surrounding protocol is built to prevent.
const ACCEPTED_STATES = new Set(["accepted", "approved"]);
const GLYPHS = {
  idle: ["○", "muted"], ready: ["○", "muted"], requested: ["○", "muted"],
  created: ["○", "muted"], registered: ["○", "muted"],
  assigned: ["◑", "info"], active: ["◑", "info"], running: ["◑", "info"],
  working: ["◑", "info"], review: ["◑", "info"], submitted: ["◑", "info"],
  input_needed: ["◐", "warn"], blocked: ["◐", "warn"], waiting: ["◐", "warn"],
  changes_requested: ["◐", "warn"], stopping: ["◐", "warn"],
  succeeded: ["●", "info"], completed: ["●", "info"], done: ["●", "info"],
  accepted: ["✓", "ok"], approved: ["✓", "ok"],
  failed: ["✕", "bad"], rejected: ["✕", "bad"],
  timed_out: ["⏱", "warn"], needs_operator: ["⚠", "bad"],
  cancelled: ["⊘", "muted"], closed: ["⊘", "muted"], expired: ["⊘", "muted"],
  abstained: ["–", "muted"]
};
function glyphFor(node) {
  const [glyph, tone] = GLYPHS[node.state] || ["·", "muted"];
  // Stale evidence is not a border decoration: an approval that no longer binds
  // must stop looking like an approval.
  if (node.stale && tone === "ok") { return ["▨", "warn"]; }
  return [glyph, tone];
}
function stateLabel(node) {
  const base = node.state || "—";
  if (node.stale && ACCEPTED_STATES.has(node.state)) { return base + " (stale)"; }
  if (node.state === "succeeded" || node.state === "completed") {
    return base + " · not accepted";
  }
  return base;
}

// --- rendering ------------------------------------------------------------
const canvas = document.getElementById("canvas");
const viewport = document.createElementNS(SVGNS, "g");
canvas.appendChild(viewport);
let view = { x: 40, y: 40, scale: 1 };
let selected = null;
let focused = null;      // node id whose direct connections are isolated
let lastGraph = null;

// Direct neighbours only: one hop in either direction. Anything deeper stops
// being an answer to "who does this node actually talk to".
function neighboursOf(graph, nodeId) {
  const near = new Set([nodeId]);
  const edges = new Set();
  for (const edge of graph.edges) {
    if (edge.from === nodeId) { near.add(edge.to); edges.add(edge.id); }
    else if (edge.to === nodeId) { near.add(edge.from); edges.add(edge.id); }
  }
  return { nodes: near, edges: edges };
}

function applyView() {
  viewport.setAttribute(
    "transform",
    "translate(" + view.x + "," + view.y + ") scale(" + view.scale + ")"
  );
}

function text(x, y, value, className) {
  const element = document.createElementNS(SVGNS, "text");
  element.setAttribute("x", x);
  element.setAttribute("y", y);
  if (className) { element.setAttribute("class", className); }
  element.textContent = String(value == null ? "" : value);
  return element;
}

// A band is a rank in the chain of command: 0 answers to the operator, each
// step down is one delegation further away.  Wide ranks wrap onto further rows
// rather than running off to the right, which is what made 328 nodes read as
// one endless horizontal strip.
const PER_ROW = 8;

function layout(nodes) {
  const bands = new Map();
  for (const node of nodes) {
    const band = node.band == null ? 5 : node.band;
    if (!bands.has(band)) { bands.set(band, []); }
    bands.get(band).push(node);
  }
  const placed = new Map();
  const ordered = [...bands.keys()].sort((a, b) => a - b);
  let row = 0;
  for (const band of ordered) {
    const members = bands.get(band);
    members.forEach((node, index) => {
      placed.set(node.id, {
        x: (index % PER_ROW) * COLUMN,
        y: (row + Math.floor(index / PER_ROW)) * ROW,
        band: band
      });
    });
    row += Math.max(1, Math.ceil(members.length / PER_ROW)) + 0.35;
  }
  return { placed: placed, bands: ordered, rows: row };
}

function render(graph) {
  lastGraph = graph;
  while (viewport.firstChild) { viewport.removeChild(viewport.firstChild); }
  const layoutResult = layout(graph.nodes);
  const positions = layoutResult.placed;
  const focus = focused ? neighboursOf(graph, focused) : null;
  paintFocusChrome(focus);

  if (!graph.nodes.length) {
    viewport.appendChild(text(0, 20, "No canonical entities in this workspace yet.", "empty"));
    applyView();
    return;
  }

  // One shared clip so long ledger text can never spill past its node box.
  const defs = document.createElementNS(SVGNS, "defs");
  const clip = document.createElementNS(SVGNS, "clipPath");
  clip.setAttribute("id", "nodeclip");
  const clipRect = document.createElementNS(SVGNS, "rect");
  clipRect.setAttribute("width", W - 8);
  clipRect.setAttribute("height", H);
  clip.appendChild(clipRect);
  defs.appendChild(clip);
  viewport.appendChild(defs);

  const edgeLayer = document.createElementNS(SVGNS, "g");
  const nodeLayer = document.createElementNS(SVGNS, "g");
  viewport.appendChild(edgeLayer);
  viewport.appendChild(nodeLayer);

  // Rank captions, so the hierarchy is legible without reading node contents.
  const captions = document.createElementNS(SVGNS, "g");
  viewport.appendChild(captions);
  const seenBands = new Set();
  for (const node of graph.nodes) {
    const position = positions.get(node.id);
    if (!position || seenBands.has(position.band)) { continue; }
    seenBands.add(position.band);
    const caption = position.band === 0
      ? "reports to operator"
      : "delegated · depth " + position.band;
    // Above the rank, not beside it: to the left it collided with the first node.
    captions.appendChild(text(0, position.y - 10, caption, "band-label"));
  }

  for (const edge of graph.edges) {
    const from = positions.get(edge.from);
    const to = positions.get(edge.to);
    if (!from || !to) { continue; }
    const x1 = from.x + W / 2, y1 = from.y + H;
    const x2 = to.x + W / 2, y2 = to.y;
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute(
      "d",
      "M " + x1 + " " + y1 + " C " + x1 + " " + (y1 + 44) + ", " + x2 + " " + (y2 - 44) +
      ", " + x2 + " " + y2
    );
    // Permanent: standing structure, who reports to whom.  Temporary: one
    // exchange bound to a single attempt.  The projection decides which.
    let edgeClass = edge.relation === "temporary" ? "edge comm" : "edge";
    if (focus) { edgeClass += focus.edges.has(edge.id) ? " incident" : " faded"; }
    path.setAttribute("class", edgeClass);
    edgeLayer.appendChild(path);
  }

  for (const node of graph.nodes) {
    const position = positions.get(node.id);
    const group = document.createElementNS(SVGNS, "g");
    let nodeClass = "node" + (node.stale ? " stale" : "") +
      (selected === node.id ? " sel" : "");
    if (focus) {
      if (!focus.nodes.has(node.id)) { nodeClass += " faded"; }
      else if (node.id !== focused) { nodeClass += " neighbour"; }
    }
    if (node.awaits_human) { nodeClass += " awaits"; }
    if (node.kind === "agent") { nodeClass += " role"; }
    group.setAttribute("class", nodeClass);
    group.setAttribute("transform", "translate(" + position.x + "," + position.y + ")");

    const rect = document.createElementNS(SVGNS, "rect");
    rect.setAttribute("width", W);
    rect.setAttribute("height", H);
    rect.setAttribute("rx", 6);
    group.appendChild(rect);

    const [glyph, tone] = glyphFor(node);
    const content = document.createElementNS(SVGNS, "g");
    content.setAttribute("clip-path", "url(#nodeclip)");
    content.appendChild(text(10, 18, glyph, tone));
    content.appendChild(text(26, 18, node.label || node.id, null));
    const line = node.kind + " · " + stateLabel(node) +
      (node.awaits_human ? "  ⏳ waiting on you" : "");
    content.appendChild(text(10, 34, line, "meta"));
    content.appendChild(text(10, 50, node.stale ? node.id + "  ▨ stale" : node.id, "meta"));
    group.appendChild(content);

    const tooltip = document.createElementNS(SVGNS, "title");
    tooltip.textContent = (node.label ? node.label + "\n" : "") + node.id;
    group.appendChild(tooltip);

    group.addEventListener("click", () => {
      if (suppressClick) { return; }
      selected = node.id;
      // Once isolating, selecting another node moves the isolation with it
      // rather than silently leaving the previous node focused.
      if (focused !== null) { focused = node.id; }
      inspect(node);
      render(graph);
    });
    nodeLayer.appendChild(group);
  }
  applyView();
}

function paintFocusChrome(focus) {
  const toggle = document.getElementById("focus-toggle");
  const count = document.getElementById("focus-count");
  const isolating = Boolean(focus) && focused === selected;
  toggle.setAttribute("aria-pressed", isolating ? "true" : "false");
  toggle.textContent = isolating ? "Show all" : "Isolate connections";
  if (focus && focused) {
    const direct = focus.nodes.size - 1;
    count.textContent = direct + (direct === 1 ? " direct link" : " direct links");
    count.className = "pill focus";
  } else {
    count.textContent = "";
    count.className = "pill";
  }
}

function setFocus(nodeId) {
  focused = nodeId;
  if (lastGraph) { render(lastGraph); }
}

document.getElementById("focus-toggle").addEventListener("click", () => {
  setFocus(focused === selected ? null : selected);
});

// Esc and a click on empty canvas both leave focus mode, so nobody gets stuck
// looking at a mostly faded graph without an obvious way out.
window.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && focused) { setFocus(null); }
});
canvas.addEventListener("click", (event) => {
  if (event.target === canvas && !suppressClick && focused) { setFocus(null); }
});

// --- role panel -----------------------------------------------------------
// Everything below writes agent-supplied text with textContent or as an option
// value; nothing reaches the DOM as markup.

let writesEnabled = false;
let catalog = null;
let currentRole = null;

function showPanel(name) {
  for (const button of document.querySelectorAll("#tabs button")) {
    const active = button.dataset.panel === name;
    button.setAttribute("aria-selected", active ? "true" : "false");
    document.getElementById("panel-" + button.dataset.panel)
      .classList.toggle("open", active);
  }
}

document.getElementById("tabs").addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (button && !button.hidden) { showPanel(button.dataset.panel); }
});

function fillSelect(element, values, selected, multiple) {
  while (element.firstChild) { element.removeChild(element.firstChild); }
  for (const value of values) {
    const option = document.createElement("option");
    option.value = typeof value === "string" ? value : value.id;
    option.textContent = typeof value === "string" ? value : (value.title || value.id);
    if (multiple) { option.selected = (selected || []).indexOf(option.value) >= 0; }
    else if (option.value === selected) { option.selected = true; }
    element.appendChild(option);
  }
}

function selectedValues(element) {
  return Array.from(element.selectedOptions).map((option) => option.value);
}

function paintSettings(record) {
  const levels = (catalog && catalog.grant_levels) || ["deny", "ask", "auto"];
  const grants = record.effective_grants || record.grants || {};
  for (const name of ["create_roles", "retire_roles", "open_links"]) {
    fillSelect(document.getElementById("grant-" + name), levels, grants[name] || "deny", false);
  }
  fillSelect(
    document.getElementById("setting-context_mode"),
    (catalog && catalog.context_modes) || ["fresh", "accumulated"],
    record.context_mode || "fresh",
    false
  );
  document.getElementById("setting-name").value = record.name || "";
  fillSelect(document.getElementById("setting-skills"),
    (catalog && catalog.skills) || [], record.skills || [], true);
  fillSelect(document.getElementById("setting-mcp"),
    (catalog && catalog.mcp_servers) || [], record.mcp_allowlist || [], true);
  fillSelect(document.getElementById("setting-tools"),
    (catalog && catalog.tools) || [], record.tool_allowlist || [], true);
  document.getElementById("setting-reason").value = "";
  document.getElementById("setting-downgrade").value = "";
  document.getElementById("downgrade-field").hidden = record.context_mode !== "fresh";
  // The model is a property of the operator-owned profile, not of the role: a
  // role that could name a model would be editing argv.
  document.getElementById("settings-model").textContent =
    "profile " + (record.profile_id || "—") +
    " — the profile fixes the executable, model, sandbox, and tool set. " +
    "Selections here can only narrow it. Catalogue entries are added by the " +
    "operator outside this UI" +
    (catalog && catalog.catalog_path ? " (" + catalog.catalog_path + ")." : ".");
  const note = document.getElementById("settings-note");
  const blockers = record.retirement_blockers || [];
  note.className = blockers.length ? "note warn" : "note";
  note.textContent = blockers.length
    ? "cannot be retired yet — " + blockers.join("; ")
    : (record.origin === "agent"
        ? "created by " + (record.created_by_agent_id || "another role") +
          " · " + (record.approval || "") + " · " + (record.rationale || "")
        : "created by a human · " + (record.rationale || ""));
}

async function loadCatalog() {
  try { catalog = await api("/api/catalog"); } catch (error) { catalog = null; }
}

async function inspect(node) {
  const inspector = document.getElementById("inspector");
  const title = document.getElementById("inspector-title");
  const body = document.getElementById("inspector-body");
  inspector.classList.add("open");
  title.textContent = node.kind + " " + node.id;
  body.textContent = "loading…";
  document.getElementById("blocked-pill").hidden = !node.awaits_human;

  const isRole = node.kind === "agent";
  const messageTab = document.querySelector('#tabs button[data-panel="message"]');
  const settingsTab = document.querySelector('#tabs button[data-panel="settings"]');
  messageTab.hidden = !(isRole && writesEnabled);
  settingsTab.hidden = !(isRole && writesEnabled);
  if (!isRole || !writesEnabled) { showPanel("record"); }
  currentRole = null;
  document.getElementById("message-result").textContent = "";
  document.getElementById("settings-result").textContent = "";
  document.getElementById("message-note").textContent = isRole
    ? "You are writing to this role. Agents talk to each other through delegation; " +
      "this channel carries human direction only."
    : "";

  try {
    const payload = await api("/api/entities/" + encodeURIComponent(node.kind) + "/" +
      encodeURIComponent(node.id));
    body.textContent = JSON.stringify(payload.record, null, 2);
    if (isRole) {
      currentRole = payload.record;
      if (writesEnabled) { paintSettings(payload.record); }
    }
  } catch (error) {
    body.textContent = String(error);
  }
}

document.getElementById("message-send").addEventListener("click", async () => {
  const result = document.getElementById("message-result");
  if (!currentRole) { return; }
  const bodyText = document.getElementById("message-body").value;
  try {
    await post("/api/agents/" + encodeURIComponent(currentRole.id) + "/messages", {
      body: bodyText,
      subject: document.getElementById("message-subject").value || null,
    });
    document.getElementById("message-body").value = "";
    result.className = "result ok";
    result.textContent = "recorded as a canonical thread message";
  } catch (error) {
    result.className = "result bad";
    result.textContent = String(error.message || error);
  }
});

document.getElementById("setting-context_mode").addEventListener("change", (event) => {
  const weakening = currentRole && currentRole.context_mode === "fresh" &&
    event.target.value === "accumulated";
  document.getElementById("downgrade-field").hidden = !weakening;
});

document.getElementById("settings-save").addEventListener("click", async () => {
  const result = document.getElementById("settings-result");
  if (!currentRole) { return; }
  const changes = {
    name: document.getElementById("setting-name").value,
    context_mode: document.getElementById("setting-context_mode").value,
    grants: {
      create_roles: document.getElementById("grant-create_roles").value,
      retire_roles: document.getElementById("grant-retire_roles").value,
      open_links: document.getElementById("grant-open_links").value,
    },
    skills: selectedValues(document.getElementById("setting-skills")),
    mcp_allowlist: selectedValues(document.getElementById("setting-mcp")),
    tool_allowlist: selectedValues(document.getElementById("setting-tools")),
  };
  const downgrade = document.getElementById("setting-downgrade");
  try {
    await post("/api/agents/" + encodeURIComponent(currentRole.id) + "/reconfigure", {
      expected_revision: currentRole.revision,
      changes: changes,
      reason: document.getElementById("setting-reason").value,
      isolation_downgrade_reason:
        document.getElementById("downgrade-field").hidden ? null : (downgrade.value || null),
    });
    result.className = "result ok";
    result.textContent = "recorded";
  } catch (error) {
    result.className = "result bad";
    result.textContent = String(error.message || error);
  }
});

async function retire(cascade) {
  const result = document.getElementById("settings-result");
  if (!currentRole) { return; }
  const reason = document.getElementById("setting-reason").value;
  if (!reason) {
    result.className = "result bad";
    result.textContent = "a retirement needs a reason; it stays in the ledger forever";
    return;
  }
  const question = cascade
    ? "Retire this role and every role it created? Nothing is deleted; they stop taking work."
    : "Retire this role? Nothing is deleted; it stops taking work.";
  if (!window.confirm(question)) { return; }
  try {
    const payload = await post(
      "/api/agents/" + encodeURIComponent(currentRole.id) + "/retire",
      { reason: reason, cascade: cascade }
    );
    result.className = "result ok";
    result.textContent = "retired " + payload.count + " role(s); history retained";
  } catch (error) {
    result.className = "result bad";
    result.textContent = String(error.message || error);
  }
}

document.getElementById("settings-retire").addEventListener("click", () => retire(false));
document.getElementById("settings-retire-cascade").addEventListener("click", () => retire(true));

let proposals = [];

async function loadProposals() {
  try { proposals = (await api("/api/proposals")) || []; } catch (error) { proposals = []; }
  const tab = document.querySelector('#tabs button[data-panel="proposals"]');
  tab.hidden = proposals.length === 0;
  tab.textContent = "Proposals (" + proposals.length + ")";
  renderProposals();
}

function renderProposals() {
  const host = document.getElementById("proposal-list");
  while (host.firstChild) { host.removeChild(host.firstChild); }
  for (const item of proposals) {
    const card = document.createElement("div");
    card.className = "field";
    const body = document.createElement("pre");
    // Agent-written prose: text only, never markup.
    body.textContent = JSON.stringify(item.proposal, null, 2);
    card.appendChild(body);
    if (writesEnabled) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Confirm this role";
      button.addEventListener("click", () => approveProposal(item.thread_id));
      card.appendChild(button);
    }
    host.appendChild(card);
  }
}

async function approveProposal(threadId) {
  const result = document.getElementById("proposal-result");
  try {
    await post("/api/agents/proposals/" + encodeURIComponent(threadId) + "/approve", {});
    result.className = "result ok";
    result.textContent = "role created, crediting its proposer";
    await loadProposals();
  } catch (error) {
    result.className = "result bad";
    result.textContent = String(error.message || error);
  }
}

function paintChrome(graph) {
  const counts = [];
  for (const [group, states] of Object.entries(graph.counts || {})) {
    const total = Object.values(states).reduce((a, b) => a + b, 0);
    if (total) { counts.push(group + ": " + total); }
  }
  document.getElementById("counts").textContent = counts.join("   ");
  const issues = (graph.issues || []).length;
  const warnings = (graph.warnings || []).length;
  document.getElementById("issues").textContent =
    "issues: " + issues + "   stale warnings: " + warnings;
  document.getElementById("truncation").textContent =
    graph.limits && graph.limits.truncated ? "graph truncated to fit display bounds" : "";
  const waiting = (graph.awaiting_human || []).length;
  if (waiting) {
    document.getElementById("issues").textContent += "   waiting on you: " + waiting;
  }
  if (graph.workspace_id) {
    document.getElementById("workspace").textContent = graph.workspace_id;
  }
}

function setStream(state, label) {
  const pill = document.getElementById("stream");
  pill.className = "pill " + state;
  pill.textContent = label;
}

// --- pan and zoom ---------------------------------------------------------
// No setPointerCapture here: capturing retargets the subsequent click to the
// SVG root, which would make nodes unclickable.  A movement threshold tells a
// drag apart from a click instead.
let dragging = null;
let suppressClick = false;
canvas.addEventListener("pointerdown", (event) => {
  dragging = { x: event.clientX, y: event.clientY, ox: view.x, oy: view.y, moved: 0 };
  suppressClick = false;
});
window.addEventListener("pointermove", (event) => {
  if (!dragging) { return; }
  const dx = event.clientX - dragging.x;
  const dy = event.clientY - dragging.y;
  dragging.moved = Math.max(dragging.moved, Math.abs(dx) + Math.abs(dy));
  if (dragging.moved > 4) { suppressClick = true; }
  view.x = dragging.ox + dx;
  view.y = dragging.oy + dy;
  applyView();
});
window.addEventListener("pointerup", () => { dragging = null; });
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
  view.scale = Math.min(2.5, Math.max(0.25, view.scale * factor));
  applyView();
}, { passive: false });

// --- SSE over fetch -------------------------------------------------------
// EventSource cannot send an Authorization header, and putting the token in the
// query string would leak it into logs and history, so the stream is read
// manually from a fetch body instead.
let lastEventId = null;

async function connect() {
  if (!self.ReadableStream || !("body" in Response.prototype)) {
    setStream("gap", "live updates unavailable — reload to refresh");
    return;
  }
  let backoff = 1000;
  for (;;) {
    try {
      setStream("reconnecting", "connecting");
      const headers = authHeaders({ "Accept": "text/event-stream" });
      if (lastEventId) { headers["Last-Event-ID"] = lastEventId; }
      const response = await fetch("/api/stream", { headers: headers });
      if (!response.ok || !response.body) { throw new Error("stream " + response.status); }
      setStream("live", "live");
      backoff = 1000;
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const chunk = await reader.read();
        if (chunk.done) { break; }
        buffer += decoder.decode(chunk.value, { stream: true });
        let split;
        while ((split = buffer.indexOf("\n\n")) >= 0) {
          handleFrame(buffer.slice(0, split));
          buffer = buffer.slice(split + 2);
        }
      }
    } catch (error) {
      setStream("reconnecting", "reconnecting");
    }
    await new Promise((resolve) => setTimeout(resolve, backoff));
    backoff = Math.min(15000, backoff * 2);
  }
}

function handleFrame(frame) {
  let event = "message";
  let data = "";
  let id = null;
  for (const line of frame.split("\n")) {
    if (line.startsWith(":")) { continue; }
    if (line.startsWith("id: ")) { id = line.slice(4); }
    else if (line.startsWith("event: ")) { event = line.slice(7); }
    else if (line.startsWith("data: ")) { data += line.slice(6); }
  }
  if (event === "hello" && data) {
    const payload = JSON.parse(data);
    if (id !== null) { lastEventId = id; }
    return;
  }
  if (event === "snapshot" && data) {
    const payload = JSON.parse(data);
    if (id !== null) { lastEventId = id; }
    paintChrome(payload.graph);
    render(payload.graph);
    setStream("live", "live");
    return;
  }
  if (event === "resume_gap") {
    setStream("gap", "resumed with a gap");
  }
}

async function boot() {
  try {
    const meta = await api("/api/meta");
    document.getElementById("workspace").textContent = meta.workspace_id;
    writesEnabled = Boolean(meta.writes_enabled);
    document.getElementById("writes").textContent = writesEnabled
      ? "writes enabled as " + meta.writer_session_id
      : "writes disabled";
    if (writesEnabled) { await loadCatalog(); }
    await loadProposals();
    document.getElementById("layers").textContent =
      meta.truth_layers.join(" › ") + " — " + meta.trust_note +
      ". No prompts, transcripts, or tool arguments are retained by design.";
  } catch (error) {
    setStream("gap", "unauthorized — reopen the printed URL");
    return;
  }
  const graph = await api("/api/graph");
  paintChrome(graph);
  render(graph);
  connect();
}

boot();
