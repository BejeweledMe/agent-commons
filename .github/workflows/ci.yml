name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Otherwise .python-version (the laptop default) would quietly override
      # the matrix interpreter for both `uv sync` and `uv run`.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v6
      # The matrix interpreter comes from setup-python; every package version
      # comes from uv.lock. `make check` is the same command a laptop runs, so
      # the local ritual and this job cannot drift apart again.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # Node runs the behaviour harnesses for the UI asset (profileOptions,
      # layout). Installed explicitly from the version file: without it those
      # tests skip, and a skip in CI is lost coverage, not a convenience —
      # tests/test_ci_environment.py turns that silence into a failure.
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - run: uv sync --locked --extra test
      - run: make check

  wheel-smoke:
    name: Wheel smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install and smoke-test built wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          WHEEL_PATH="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install "$WHEEL_PATH[mcp]"
          "$RUNNER_TEMP/wheel-smoke/bin/agent-commons" --help
          "$RUNNER_TEMP/wheel-smoke/bin/agent-commons-mcp" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import agent_commons; print(agent_commons.__version__)"
      - uses: actions/upload-artifact@v6
        with:
          name: agent-commons-${{ matrix.os }}-dist
          path: dist/*
